spring.application.name=marathon-backend
spring.profiles.active=local

# PostgreSQL
# F41: sslmode=require. El servidor tiene ssl=on con un certificado
# autofirmado, asi que la conexion viaja cifrada.
#
# POR QUE 'require' Y NO 'verify-full'. verify-full exige que el cliente valide
# el certificado contra una CA de confianza, y este es autofirmado: habria que
# distribuir el certificado a cada cliente como CA. Con 'require' el trafico va
# cifrado pero NO se autentica al servidor, asi que no protege de un ataque de
# intermediario. Para localhost es una compensacion razonable; para una base en
# otra maquina no lo seria. Queda anotado en CIFRADO.md.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mod_venta_inve}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:defaultDevSecretChangeInProduction}
app.jwt.expiration=86400000

# Anthropic (Asistente IA) — la key real va en application-local.properties (gitignored)
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-4-6

# --- F37: un pool de conexiones por rol --------------------------------------
# Desactivado por defecto: sin las credenciales de los seis usr_*_marathon la
# aplicacion no podria arrancar. Se activa en application-local.properties, que
# esta en .gitignore y es donde viven esas credenciales.
# Con enabled=false toda la aplicacion se conecta como spring.datasource.username
# (el comportamiento anterior a la F37).
app.datasource.roles.enabled=${DB_ROLES_ENABLED:false}

# --- F41: clave de cifrado de datos personales -------------------------------
# NO se escribe aqui ningun valor por defecto que sea una clave. Llega por
# variable de entorno del PROCESO, que pone scripts\cifrado\iniciar_backend.ps1
# tras descifrar el almacen DPAPI de la maquina. Si falta, la aplicacion arranca
# igual pero los datos de contacto de cliente y proveedor se ven vacios, y queda
# un WARN en el registro.
app.cifrado.clave=${MARATHON_CRYPTO_KEY:}
