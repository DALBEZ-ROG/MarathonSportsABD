spring.application.name=marathon-backend
spring.profiles.active=local

# PostgreSQL
# F42: sslmode=verify-full. El trafico va cifrado Y el servidor queda
# AUTENTICADO, asi que tambien protege de un ataque de intermediario. En la F41
# se habia quedado en 'require', que solo cifra.
#
# COMO SE RESOLVIO LO DEL CERTIFICADO AUTOFIRMADO. No hizo falta tocar el
# truststore del JDK: el driver de PostgreSQL acepta 'sslrootcert' apuntando al
# certificado, que se copia a C:\ProgramData\MarathonSports\tls\server.crt.
# Modificar el cacerts del JDK habria atado la aplicacion a esa instalacion
# concreta de Java y se habria perdido en la siguiente actualizacion.
#
# El certificado lleva CN=localhost y subjectAltName con DNS:localhost e
# IP:127.0.0.1: verify-full comprueba el nombre del host, y sin el SAN fallaria.
#
# Verificado en la F42 con tres pruebas: conecta con el certificado correcto,
# y RECHAZA con "certificate verify failed" tanto si falta el fichero como si
# se le pasa una CA ajena. La verificacion es real, no una etiqueta.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mod_venta_inve}?sslmode=${DB_SSLMODE:verify-full}&sslrootcert=${DB_SSLROOTCERT:C:/ProgramData/MarathonSports/tls/server.crt}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:defaultDevSecretChangeInProduction}
# 2 horas (7.200.000 ms). Eran 24 h hasta la F49.
#
# POR QUE SE BAJO (D-23 y D-27, docs/PENDIENTE.md §3)
# El logout solo borra localStorage: con JWT sin estado y sin lista de
# revocacion, un token capturado sigue valiendo hasta que expira. Revocar de
# verdad exige una tabla de denegacion y una comprobacion en CADA peticion, y se
# descarto por coste. Esta linea es la mitigacion que queda: acorta la ventana de
# un token robado de 24 h a 2 h, y lo hace a la vez para D-23 (token no revocado)
# y para D-27 (token legible desde cualquier JavaScript de la pagina).
#
# NO obliga a nadie a volver a entrar: el refresh token sigue durando 7 dias
# (JwtUtils.REFRESH_EXPIRATION) y desde la L7 comprueba que el usuario siga
# activo, asi que dar de baja a alguien le corta el acceso en cuanto caduca su
# token de 2 h — antes eran 24 h, y renovables indefinidamente.
app.jwt.expiration=7200000

# Anthropic (Asistente IA) — la key real va en application-local.properties (gitignored)
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-4-6

# --- F37: un pool de conexiones por rol --------------------------------------
# Desactivado por defecto: sin las credenciales de los seis usr_*_marathon la
# aplicacion no podria arrancar. Se activa en application-local.properties, que
# esta en .gitignore y es donde viven esas credenciales.
# Con enabled=false toda la aplicacion se conecta como spring.datasource.username
# (el comportamiento anterior a la F37).
app.datasource.roles.enabled=${DB_ROLES_ENABLED:false}

# --- F41: clave de cifrado de datos personales -------------------------------
# NO se escribe aqui ningun valor por defecto que sea una clave. Llega por
# variable de entorno del PROCESO, que pone scripts\cifrado\iniciar_backend.ps1
# tras descifrar el almacen DPAPI de la maquina. Si falta, la aplicacion arranca
# igual pero los datos de contacto de cliente y proveedor se ven vacios, y queda
# un WARN en el registro.
app.cifrado.clave=${MARATHON_CRYPTO_KEY:}

# --- L2: interruptor del asistente IA ----------------------------------------
# Apagado por defecto. Hasta la L2 este modulo ejecutaba contra la base el SQL
# que devolvia el modelo, con una lista de palabras prohibidas como unica
# defensa: no cubria DO/CALL/GRANT/COPY, y en cambio rechazaba cualquier
# consulta que mencionara created_at o updated_at.
#
# Ahora hay dos barreras independientes (ValidadorSqlIA analiza el SQL de
# verdad; EjecutorConsultaIA lo corre en transaccion de solo lectura), pero el
# interruptor se queda: encender un modulo que traduce lenguaje natural a SQL
# contra la base de produccion debe ser una decision consciente.
app.ia.enabled=${IA_ENABLED:false}

# --- L10: datos de demostracion ----------------------------------------------
# DataInitializer crea seis usuarios con contrasenas FIJAS y publicadas en el
# codigo (Admin1234! / Demo1234!). Sirve para la demo y para las pruebas.
#
# Se deja en true por defecto porque ponerlo a false romperia el primer arranque
# descrito en SETUP_COMPLETO.md y todos los entornos ya montados. En un
# despliegue real hay que ponerlo a false y crear los usuarios a mano.
# ComprobacionesDeArranque avisa por consola mientras este encendido.
# D-26: por defecto NO. Los datos de demostracion se creaban solos en cada
# arranque, incluidos cinco usuarios con contrasena conocida.
#
# Apagarlo no era trivial y por eso estuvo abierto: DataInitializer no solo
# creaba los usuarios demo, tambien LOS ROLES y el primer administrador, asi
# que apagarlo dejaba una base sin forma de entrar. Esa siembra vive ahora en
# sql/fase61_siembra_inicial.sql, que es donde corresponde (regla 3: migran los
# scripts, no la aplicacion).
#
# Para recuperarlos en un entorno de pruebas: DATOS_DEMO=true. Ojo con lo que
# eso reactiva; esta explicado en fase61_siembra_inicial_rollback.sql.
app.datos-demo.enabled=${DATOS_DEMO:false}

# --- L10: freno a los intentos de login ---------------------------------------
app.login.max-intentos=${LOGIN_MAX_INTENTOS:10}
app.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}

# --- Compras (F66) -----------------------------------------------------------
# IVA que se aplica al documentar una compra desde lo recibido. Ecuador esta en
# el 15% desde 2024. Se deja como propiedad y no fijo en el codigo porque un
# tipo impositivo cambia por ley, no por un despliegue.
app.compras.iva-porcentaje=${IVA_COMPRAS:15}

# --- Produccion (F71) --------------------------------------------------------
# Al completar una orden, el sistema PROPONE la mano de obra y el coste
# indirecto en vez de dejarlos en cero. No salen de ningun fichaje ni de ninguna
# factura -el sistema no los tiene- sino de estas dos tarifas, que es lo que
# hace un costeo por absorcion cuando no hay datos reales:
#
#   mano de obra = tarifa por unidad x unidades producidas
#   indirecto    = porcentaje x (materia prima + mano de obra)
#
# Quien completa la orden puede cambiar los dos importes. Lo que se evita es el
# cero por omision, que hacia decir al analisis de costos que fabricar sale
# exactamente lo que vale la materia prima.
app.produccion.mano-obra-por-unidad=${MANO_OBRA_UNIDAD:2.50}
app.produccion.indirecto-porcentaje=${INDIRECTO_PORCENTAJE:15}
