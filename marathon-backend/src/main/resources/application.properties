spring.application.name=marathon-backend
spring.profiles.active=local

# PostgreSQL
# F42: sslmode=verify-full. El trafico va cifrado Y el servidor queda
# AUTENTICADO, asi que tambien protege de un ataque de intermediario. En la F41
# se habia quedado en 'require', que solo cifra.
#
# COMO SE RESOLVIO LO DEL CERTIFICADO AUTOFIRMADO. No hizo falta tocar el
# truststore del JDK: el driver de PostgreSQL acepta 'sslrootcert' apuntando al
# certificado, que se copia a C:\ProgramData\MarathonSports\tls\server.crt.
# Modificar el cacerts del JDK habria atado la aplicacion a esa instalacion
# concreta de Java y se habria perdido en la siguiente actualizacion.
#
# El certificado lleva CN=localhost y subjectAltName con DNS:localhost e
# IP:127.0.0.1: verify-full comprueba el nombre del host, y sin el SAN fallaria.
#
# Verificado en la F42 con tres pruebas: conecta con el certificado correcto,
# y RECHAZA con "certificate verify failed" tanto si falta el fichero como si
# se le pasa una CA ajena. La verificacion es real, no una etiqueta.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mod_venta_inve}?sslmode=${DB_SSLMODE:verify-full}&sslrootcert=${DB_SSLROOTCERT:C:/ProgramData/MarathonSports/tls/server.crt}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:defaultDevSecretChangeInProduction}
app.jwt.expiration=86400000

# Anthropic (Asistente IA) — la key real va en application-local.properties (gitignored)
anthropic.api.key=${ANTHROPIC_API_KEY:}m
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-4-6

# --- F37: un pool de conexiones por rol --------------------------------------
# Desactivado por defecto: sin las credenciales de los seis usr_*_marathon la
# aplicacion no podria arrancar. Se activa en application-local.properties, que
# esta en .gitignore y es donde viven esas credenciales.
# Con enabled=false toda la aplicacion se conecta como spring.datasource.username
# (el comportamiento anterior a la F37).
app.datasource.roles.enabled=${DB_ROLES_ENABLED:false}

# --- F41: clave de cifrado de datos personales -------------------------------
# NO se escribe aqui ningun valor por defecto que sea una clave. Llega por
# variable de entorno del PROCESO, que pone scripts\cifrado\iniciar_backend.ps1
# tras descifrar el almacen DPAPI de la maquina. Si falta, la aplicacion arranca
# igual pero los datos de contacto de cliente y proveedor se ven vacios, y queda
# un WARN en el registro.
app.cifrado.clave=${MARATHON_CRYPTO_KEY:}
