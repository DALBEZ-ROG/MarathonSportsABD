# Perfil de PRUEBAS (L0 del plan). Se activa con @ActiveProfiles("test").
#
# ---------------------------------------------------------------------------
# NUNCA apunta a mod_venta_inve.
# ---------------------------------------------------------------------------
# La base de pruebas se construye replicando el esquema REAL, no escribiendolo
# a mano:
#
#   pg_dump --schema-only --no-owner mod_venta_inve > esquema.sql
#   createdb mod_venta_inve_test
#   psql -d mod_venta_inve_test -f esquema.sql
#
# Se hace asi por dos motivos. Uno: con ddl-auto=validate, la prueba de humo
# comprueba que las 36 entidades JPA cuadran con el esquema que de verdad hay
# en produccion. Dos: ejecutar los 39 scripts fase00..fase43 en orden es
# justamente el procedimiento fragil que la auditoria senala (§3.7), y montar
# el arnes sobre el no tendria sentido.
#
# Rehacer la base de pruebas desde cero es barato: dropdb + los tres comandos
# de arriba. Conviene rehacerla cada vez que cambie el esquema real.
#
# ---------------------------------------------------------------------------
# «Conviene» era poco. Paso lo que tenia que pasar (F95).
# ---------------------------------------------------------------------------
# La F92 creo el esquema `control` y se aplico solo a mod_venta_inve. La base de
# pruebas se quedo sin el, y como ddl-auto=validate compara las entidades con el
# esquema ANTES de ejecutar nada, el contexto de Spring dejo de arrancar: 161 de
# las 209 pruebas —todas las que necesitan contexto— llevaban rojas desde
# entonces, con el mensaje
#
#     Schema-validation: missing table [control.operacion]
#
# Lo peor no es que se rompiera; es que se rompio en silencio durante tres fases
# de trabajo, porque un fallo al CARGAR el contexto se parece mucho a «no tengo
# el entorno montado» y se lee por encima. Detectado el 2026-09-01 corriendo la
# suite entera, que es lo que no se hizo entonces.
#
# ASI QUE: toda migracion que toque el esquema se aplica a LAS DOS bases, y se
# corre `mvn test` despues. Las dos cosas, no una.
#
# ---------------------------------------------------------------------------
# La contrasena NO se versiona.
# ---------------------------------------------------------------------------
# Se toma de la variable de entorno TEST_DB_PASSWORD, sin valor por defecto:
# si falta, el contexto no arranca y se ve el motivo. Es la misma politica que
# application-local.properties, que esta en .gitignore.
#
#   PowerShell : $env:TEST_DB_PASSWORD = "<clave de usr_admin_marathon>"
#   Bash       : export TEST_DB_PASSWORD='<clave de usr_admin_marathon>'

spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5433}/${TEST_DB_NAME:mod_venta_inve_test}?sslmode=${TEST_DB_SSLMODE:require}
spring.datasource.username=${TEST_DB_USER:usr_admin_marathon}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# sslmode=require y no verify-full como en produccion: cifra el trafico pero no
# ata las pruebas al certificado de C:/ProgramData/MarathonSports/tls. La
# verificacion del certificado es una propiedad del despliegue, y se comprueba
# alli; atarla aqui solo haria que las pruebas fallaran en otro equipo.

# ---------------------------------------------------------------------------
# Aqui esta el valor real de la prueba de humo: si una @Entity deja de coincidir
# con su tabla, Hibernate no construye el contexto y la prueba falla. Es la
# unica red que hoy tiene el proyecto contra un cambio de esquema que rompa el
# mapeo, porque la aplicacion no migra nada (ddl-auto=validate).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# F37 desactivado en pruebas: un solo pool. Con roles.enabled=true harian falta
# las seis credenciales usr_*_marathon y cualquier prueba dependeria de que las
# seis esten bien puestas. El enrutado por rol se prueba aparte, no aqui.
app.datasource.roles.enabled=false

# Secreto solo de pruebas. No es el de ningun entorno real, y no tiene por que
# serlo: ninguna prueba valida un token emitido fuera del arnes.
app.jwt.secret=arnes-de-pruebas-marathon-no-usar-fuera-de-aqui-0123456789abcdef
app.jwt.expiration=86400000

# Sin integraciones externas en pruebas.
anthropic.api.key=
app.cifrado.clave=
app.datos-demo.enabled=true
app.login.max-intentos=1000
